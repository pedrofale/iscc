# The tutorials' tumor: the paper's regime at its sweep scale (validation/paper/regime.py,
# config("mid")): a 96 by 96 field of five glands in stroma, demon's crowding law, CINner's driver
# dosage with effect 1.03, breach-gated invasion and stromal survival with the paper's values, the
# founding acinus closed for 200 generations, and tau-leaping with binomial deaths and the step of
# Cao, Gillespie and Petzold (2006). The metastatic lattice is off (met_grid_size 0) and no treatment
# resistance is set; "Shape the tumor" shows how to switch both on. It is configs/landing_hero.yaml
# without its treatment schedule, resistance genes and metastasis.
mode: genotype
update_mode: tau
tau: 0.5
snapshot_every: 3
coarsen_passengers: true
max_cells: 8000
genome_params:
  n_segments: 12
  segment_size: 500
selection_params:
  prop_driver: 0.04
  prop_dispersal: 0.0
  prop_immune_resistance: 0.02
  prop_treatment_resistance: 0.0     # as the paper regime; the package default (0.1) pre-seeds resistance
  prop_breach: 0.002
  breach_effects: 1.01
  prop_stromal_survival: 0.002
  stromal_survival_effects: 4.0
  breach_cost: 0.6
  stromal_survival_cost: 0.05
  met_survival_cost: 0.15
  max_mut_drivers: 12
  driver_effects: 1.03
  trait_source: mutation
  prop_met_survival: 0.015
  met_survival_effects: 3.0
cell_params:
  cancer:
    division_rate: 0.7
    death_rate: 0.05
    max_birth_rate: 2.0
    n_snvs_per_allele: 0.1
    dispersal_rate: 0.9
    subtype: ER+
    mutation_rate: 0.15
    wgd_rate: 0.01
germline_params:
  het_frac: 0.005
  hom_frac: 0.33
deme_params:
  carrying_capacity: 30
  initial_cancer_cells: 20
  resident_pressure_ref: 0.2
  maximum_death_rate: 5.0
  crowding_overfill: 1.5
  crowding_d1: 5.0
  tau_deaths: binomial
  tau_step: cgp
  tau_epsilon: 0.01
spatial_params:
  grid_size: 96
  structure_radius: 4
  n_glands: 5
  gland_radius: 4
  min_gland_sep: 13
  K_duct: 60
  K_stroma: 30
  stroma_fill_frac: 0.3
  cross_gland_kappa: 0.06
  cross_gland_lambda: 30
  breach_gated_invasion: true
  epithelial_barrier: 0.0
  stromal_hazard: 0.9
  origin_confinement:
    dispersal_factor: 0.0
    established_at: 0.5
    generations: 200
    clock: generations
  met_grid_size: 0
  K_met: 60
  host_fill_frac: 0.5
  met_seed_kappa: 0.03
  met_hazard: 3.5
  met_transit_floor: 0.001
