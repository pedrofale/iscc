# Example primary tumor for the iscc tutorials: a small cluster of epithelial glands (ducts) that a
# cancer founds inside and grows across, under CINner-style selection. These are the same
# reasonably-sized glands as the docs landing simulation (configs/landing.yaml), but WITHOUT its
# metastasis + treatment arc — the tutorials grow this primary, sample it, and assay it. The
# metastasis/clinical-arc version stays in configs/landing.yaml. Genotype (count) engine.
mode: genotype
update_mode: tau      # half-generation steps
tau: 0.5
snapshot_every: 1

genome_params:
  n_segments: 12
  segment_size: 50    # 600 genes total

selection_params:
  prop_driver: 0.04
  prop_dispersal: 0.0
  prop_immune_resistance: 0.02
  # a rare, strong duct-escape (breach) subclone against a high epithelial barrier: the ducts pack
  # full before a subclone breaks into the stroma.
  prop_breach: 0.012
  breach_effects: 2.2
  prop_stromal_survival: 0.03
  stromal_survival_effects: 2.2

cell_params:
  cancer:
    division_rate: 0.7
    death_rate: 0.05
    max_birth_rate: 0.95
    mutation_rate: 0.6
    dispersal_rate: 0.35
    cnv_prob: 0.15
    wgd_rate: 0.05

deme_params:
  carrying_capacity: 20
  initial_cancer_cells: 8
  resident_pressure_ref: 0.2

spatial_params:
  grid_size: 26
  structure_radius: 3
  n_glands: 4
  gland_radius: 3
  min_gland_sep: 8
  K_duct: 40
  K_stroma: 26
  stroma_fill_frac: 0.3
  cross_gland_kappa: 0.06
  epithelial_barrier: 6.0
  stromal_hazard: 0.7
