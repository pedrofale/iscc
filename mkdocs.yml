site_name: iscc
site_description: >-
  in silico cancer center: a multi-modal tumor evolution data simulator
site_url: https://pedrofale.github.io/iscc/
repo_url: https://github.com/pedrofale/iscc
repo_name: pedrofale/iscc
edit_uri: edit/dev/docs/
docs_dir: docs

# Not published yet (kept in docs/ to finish privately): the output schema page.
exclude_docs: |
  schema.md

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.footer
    - navigation.tracking
    # NOT navigation.sections: that renders every group as a flat always-open header. Without it the
    # tutorial groups (Getting started / Assays / Examples) are COLLAPSIBLE and only the group holding
    # the current page is expanded.
    - navigation.top
    - toc.follow
    - toc.integrate      # fold the page TOC into the left sidebar → a single left nav (dynestyx-style)
    - search.suggest
    - content.code.copy

extra_css:
  - stylesheets/extra.css
  - stylesheets/nav.css

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

# The DNA tutorial writes real equations (the relation between a read count, purity, copy number and
# multiplicity). Without these the page shows raw LaTeX source.
extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

# Cross-notebook links are authored as `other.ipynb` (works in Jupyter); this rewrites them
# to the site's directory URLs at build time. See hooks/notebook_links.py.
hooks:
  - hooks/notebook_links.py

plugins:
  - search
  - mkdocs-jupyter:
      include_source: true
      execute: false
  - mkdocstrings:
      handlers:
        python:
          paths: [src]          # griffe reads docstrings statically from src/ (no import needed)
          options:
            docstring_style: numpy   # the codebase documents params NumPy-style (Parameters\n----------)
            docstring_options:
              # Several public classes (the treatments) intentionally forward
              # constructor args through **kwargs to a base class; we still document those
              # params on the subclass page, so don't warn that they aren't literal signature params.
              warn_unknown_params: false
            show_root_heading: true
            show_root_full_path: true   # show the full call path, e.g. iscc.data.scDNA
            show_bases: true
            show_source: false
            inherited_members: true
            merge_init_into_class: true
            docstring_section_style: table
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            summary: true
            members_order: source
            filters: ["!^_"]
            heading_level: 1

# Tutorials render from the executed notebooks in docs/tutorials/ (symlinks to notebooks/). API Reference is
# generated from src/ docstrings via mkdocstrings.
nav:
  - Home: index.md
  - Overview: overview.md
  - Installation: installation.md
  - Parameters: parameters.md
  - Tutorials:
      - Quickstart: tutorials/01_quickstart.ipynb
      - Shape the tumor: tutorials/02_shape_the_tumor.ipynb
      - Shape the data: tutorials/03_shape_the_data.ipynb
      - A cohort: tutorials/04_cohort.ipynb
      - Simulated next to real data: tutorials/05_simulated_next_to_real.ipynb
      - Analysis tools:
          - Purity, copy number and clones from bulk WGS with ASCAT and PyClone-VI: tutorials/tool_ascat_pyclonevi.ipynb
          - Copy number from single-cell DNA with HMMcopy: tutorials/tool_hmmcopy.ipynb
          - Matching scRNA cells to scDNA clones with clonealign: tutorials/tool_clonealign.ipynb
          - Copy number and malignancy from scRNA with inferCNV: tutorials/tool_scrna_cnv.ipynb
          - Cell-type deconvolution of Visium spots with RCTD: tutorials/tool_rctd.ipynb
          - Batch integration of a cohort with Harmony and scVI: tutorials/tool_integration.ipynb
  - API Reference:
      - reference/index.md
      - Tumor:
          - GenotypeTumor: reference/GenotypeTumor.md
      - Cohort:
          - Cohort: reference/Cohort.md
          - grow_tumor: reference/grow_tumor.md
          - assign_batches: reference/assign_batches.md
          - pool_cell_data: reference/pool_cell_data.md
          - run_cohort_batches: reference/run_cohort_batches.md
          - concat_cohort_batches: reference/concat_cohort_batches.md
      - Pregrown:
