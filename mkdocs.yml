site_name: iscc
site_description: >-
  in silico cancer center: a multi-modal tumor evolution data simulator
site_url: https://pedrofale.github.io/iscc/
repo_url: https://github.com/pedrofale/iscc
repo_name: pedrofale/iscc
edit_uri: edit/dev/docs/
docs_dir: docs

# Not published yet (kept in docs/ to finish privately): the Guide pages (parameters/schema).
exclude_docs: |
  parameters.md
  schema.md

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.footer
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.suggest
    - content.code.copy

extra_css:
  - stylesheets/extra.css
  - stylesheets/nav.css

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - toc:
      permalink: true

plugins:
  - search
  - mkdocs-jupyter:
      include_source: true
      execute: false
  - mkdocstrings:
      handlers:
        python:
          paths: [src]          # griffe reads docstrings statically from src/ (no import needed)
          options:
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            members_order: source
            docstring_section_style: table
            filters: ["!^_"]
            heading_level: 1

# Tutorials = a few fundamental notebooks; API Reference is generated from src/ via mkdocstrings.
# (The full science/benchmark notebooks live in notebooks/ and can be published later.)
nav:
  - Home: index.md
  - Overview: overview.md
  - Installation: installation.md
  - Tutorials:
      - Pipeline walkthrough: tutorials/01_pipeline_walkthrough.ipynb
      - Tumor growth: tutorials/02_tumor_growth.ipynb
      - Data overview: tutorials/03_data_overview.ipynb
  - API Reference:
      - Overview: reference/index.md
      - Tumor:
          - GenotypeTumor: reference/GenotypeTumor.md
          - GlandularTumor: reference/GlandularTumor.md
      - Treatment:
          - Chemotherapy: reference/Chemotherapy.md
          - TargetedTherapy: reference/TargetedTherapy.md
          - Immunotherapy: reference/Immunotherapy.md
          - Surgery: reference/Surgery.md
      - Sample:
          - Biopsy: reference/Biopsy.md
          - Dissociation: reference/Dissociation.md
      - Data:
          - scDNA: reference/scDNA.md
          - bulkDNA: reference/bulkDNA.md
          - scRNA: reference/scRNA.md
          - Visium: reference/Visium.md
      - Inference:
          - ABC: reference/ABC.md
