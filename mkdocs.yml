site_name: iscc
site_description: >-
  in silico cancer center: a multi-modal tumor evolution data simulator
site_url: https://pedrofale.github.io/iscc/
repo_url: https://github.com/pedrofale/iscc
repo_name: pedrofale/iscc
edit_uri: edit/dev/docs/
docs_dir: docs

# Not published yet (kept in docs/ to finish privately): the Guide pages (parameters/schema).
exclude_docs: |
  parameters.md
  schema.md

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.footer
    - navigation.tracking
    # NOT navigation.sections: that renders every group as a flat always-open header. Without it the
    # tutorial groups (Getting started / Assays / Examples) are COLLAPSIBLE and only the group holding
    # the current page is expanded.
    - navigation.top
    - toc.follow
    - toc.integrate      # fold the page TOC into the left sidebar → a single left nav (dynestyx-style)
    - search.suggest
    - content.code.copy

extra_css:
  - stylesheets/extra.css
  - stylesheets/nav.css

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

# The DNA tutorial writes real equations (the relation between a read count, purity, copy number and
# multiplicity). Without these the page shows raw LaTeX source.
extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - mkdocs-jupyter:
      include_source: true
      execute: false
  - mkdocstrings:
      handlers:
        python:
          paths: [src]          # griffe reads docstrings statically from src/ (no import needed)
          options:
            docstring_style: numpy   # the codebase documents params NumPy-style (Parameters\n----------)
            docstring_options:
              # Several public classes (treatments, GlandularTumor) intentionally forward
              # constructor args through **kwargs to a base class; we still document those
              # params on the subclass page, so don't warn that they aren't literal signature params.
              warn_unknown_params: false
            show_root_heading: true
            show_root_full_path: true   # show the full call path, e.g. iscc.data.scDNA
            show_bases: true
            show_source: false
            inherited_members: true   # e.g. GlandularTumor's API lives on the shared Tumor base
            merge_init_into_class: true
            docstring_section_style: table
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            summary: true
            members_order: source
            filters: ["!^_"]
            heading_level: 1

# Tutorials render from the executed notebooks in docs/tutorials/ (symlinks to notebooks/). API Reference is
# generated from src/ docstrings via mkdocstrings.
nav:
  - Home: index.md
  - Overview: overview.md
  - Installation: installation.md
  - Tutorials:
      - iscc overview: tutorials/01_pipeline_walkthrough.ipynb
      - Tumor evolution:
          - Exploring the tumor: tutorials/02_tumor_growth.ipynb
          - The shared tumour: tutorials/base_simulation.ipynb
          - Compartment selection — DCIS to IDC: tutorials/compartment_selection_confound.ipynb
          - Treatment and the four escape modes: tutorials/treatment_escape_modes.ipynb
          - Metastasis: tutorials/metastasis.ipynb
      - Data generation:
          - Bulk & single-cell DNA: tutorials/assay_dna.ipynb
          - Single-cell RNA: tutorials/assay_scrna.ipynb
          - Spatial (Visium): tutorials/assay_spatial.ipynb
          - Sequencing reads: tutorials/reads.ipynb
      - Data analysis examples:
          - The analysis dataset and its ground truth: tutorials/analysis_ground_truth.ipynb
          - Integrating scDNA and scRNA with clonealign: tutorials/tool_clonealign_R.ipynb
          - Calling copy number from scRNA with Numbat: tutorials/tool_numbat_R.ipynb
          - Clonal trees from DNA: tutorials/tree_inference_dna.ipynb
          - Deconvolving Visium spots with RCTD: tutorials/tool_rctd_R.ipynb
          - Gene-expression programs: tutorials/gene_programs.ipynb
          - Recovering progression constraints with TreeMHN: tutorials/tool_treemhn_R.ipynb
          - Integrating a patient cohort with scDEF: tutorials/tool_scdef_cohort.ipynb
  - API Reference:
      - reference/index.md
      - Tumor:
          - GenotypeTumor: reference/GenotypeTumor.md
          - GlandularTumor: reference/GlandularTumor.md
          - Tumor (base): reference/Tumor.md
      - Treatment:
          - Chemotherapy: reference/Chemotherapy.md
          - TargetedTherapy: reference/TargetedTherapy.md
          - Immunotherapy: reference/Immunotherapy.md
          - Surgery: reference/Surgery.md
          - Treatment (base): reference/Treatment.md
      - Sample:
          - Resection: reference/Resection.md
          - Biopsy: reference/Biopsy.md
          - Dissociation: reference/Dissociation.md
          - spatialize: reference/spatialize.md
          - tissue_image: reference/tissue_image.md
      - Data:
          - bulkDNA: reference/bulkDNA.md
          - scDNA: reference/scDNA.md
          - scRNA: reference/scRNA.md
          - Visium: reference/Visium.md
          - DNA (base): reference/DNA.md
          - DNABatchHyperParams: reference/DNABatchHyperParams.md
          - RNABatchHyperParams: reference/RNABatchHyperParams.md
          - VisiumBatchHyperParams: reference/VisiumBatchHyperParams.md
      - Reads:
          - emit_dna_reads: reference/emit_dna_reads.md
          - emit_scrna_reads: reference/emit_scrna_reads.md
          - emit_visium_reads: reference/emit_visium_reads.md
      - Inference:
          - ABC: reference/ABC.md
          - Prior: reference/Prior.md
          - Posterior: reference/Posterior.md
      - Calibration:
          - estimate_dna: reference/estimate_dna.md
          - estimate_rna: reference/estimate_rna.md
          - estimate_visium: reference/estimate_visium.md
