site_name: iscc
site_description: >-
  in silico cancer center: a multi-modal tumor evolution data simulator
site_url: https://pedrofale.github.io/iscc/
repo_url: https://github.com/pedrofale/iscc
repo_name: pedrofale/iscc
edit_uri: edit/dev/docs/
docs_dir: docs

# Not published yet (kept in docs/ to finish privately): the Guide pages (parameters/schema)
# and Installation.
exclude_docs: |
  parameters.md
  schema.md
  installation.md

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.footer
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.suggest
    - content.code.copy

extra_css:
  - stylesheets/extra.css
  - stylesheets/nav.css

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - toc:
      permalink: true

plugins:
  - search
  - mkdocs-jupyter:
      include_source: true
      execute: false

# The Guide pages (parameters/schema) and Installation are still excluded (see exclude_docs).
# Tutorials = the mechanics tours; Benchmarks = the science notebooks backing the paper's results.
nav:
  - Home: index.md
  - Overview: overview.md
  - Tutorials:
      - Pipeline walkthrough: tutorials/01_pipeline_walkthrough.ipynb
      - Tumor growth: tutorials/02_tumor_growth.ipynb
      - Data overview: tutorials/03_data_overview.ipynb
      - "Assay: DNA": tutorials/assay_dna.ipynb
      - "Assay: scRNA": tutorials/assay_scrna.ipynb
      - "Assay: spatial": tutorials/assay_spatial.ipynb
      - Read-level output: tutorials/reads.ipynb
  - Benchmarks:
      - Shared tumour substrate: benchmarks/base_simulation.ipynb
      - Compartment & niche confound: benchmarks/compartment_selection_confound.ipynb
      - Multi-modal integration: benchmarks/combining_scdna_scrna.ipynb
      - WGD & the allele layer: benchmarks/wgd_allele_cna.ipynb
      - Gene-program confound: benchmarks/gene_programs.ipynb
      - Phylogeny from DNA: benchmarks/tree_inference_dna.ipynb
      - Spatial deconvolution: benchmarks/scrna_visium_integration.ipynb
      - Cohort shared programs: benchmarks/cohort_shared_programs.ipynb
      - Cohort recurrence & MHN: benchmarks/cohort_mhn_recurrence.ipynb
