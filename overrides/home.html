{% extends "main.html" %}

<!--
  Splash landing page for iscc (used only by docs/index.md via `template: home.html`).
  Injects a full-width hero into the `tabs` block (which renders right under the top
  navigation bar) and blanks the normal article `content`, so Home is just the hero
  image + the top menu. The rest of the docs use the default Material layout.
-->

{% block extrahead %}
  {{ super() }}
  <style>
    /* Home splash ONLY (this <style> ships only on the page rendered from home.html):
       a transparent header + tab bar over a dark, full-bleed hero. Content pages keep
       the solid (black) header. */
    .md-header,
    .md-tabs {
      background-color: transparent !important;
      box-shadow: none !important;
    }
    body,
    .md-container,
    .md-main {
      background-color: #0d1117;
    }
    .mdx-hero__title { color: #f0f6fc; }
  </style>
{% endblock %}

{% block tabs %}
  {{ super() }}
  <section class="mdx-hero">
    <div class="mdx-hero__inner">
      <h1 class="mdx-hero__title">in silico cancer center</h1>
      <img
        class="mdx-hero__image"
        src="{{ 'assets/landing_hero.gif' | url }}"
        alt="A primary tumor grows through its ducts, breaches into the stroma and seeds a clonally-linked metastasis; after resection and chemotherapy a resistant subclone relapses the deposit. Two cell-resolution deme-grids grow above a 2-band Muller on one shared clone colormap."
      />
    </div>
  </section>
{% endblock %}

{% block content %}{% endblock %}
